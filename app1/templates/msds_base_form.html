{% extends 'layout.html' %}
{% load i18n %}

{% block extra_head %}
  <!-- Google tag (gtag.js) event - delayed navigation helper -->
  <script>
    // Helper to delay navigation until the gtag event fires
    function gtagSendEvent(url) {
      var callback = function () {
        if (typeof url === 'string') {
          window.location = url;
        }
      };
      gtag('event', 'conversion_event_engagement', {
        'event_callback': callback,
        'event_timeout': 2000
        // aquí podrías agregar más parámetros de evento
      });
      return false;
    }
  </script>
{% endblock %}

{% block body %}
  <div class="section-container text-center">
    <form method="post">
      {% csrf_token %}
      {{ wizard.management_form }}
      {% include '_form_snippet.html' %}

      <!-- Pagination Buttons -->
      <div class="pagination-container">
        {% for step in wizard.steps.all %}
          <button type="submit" name="wizard_goto_step" value="{{ step }}" class="btn pagination-btn {% if step == wizard.steps.current %}active{% endif %}">{{ forloop.counter }} <!-- Display step number --></button>
        {% endfor %}
      </div>

      <!-- Navigation Buttons -->
      <div class="form-navigation">
        {% if wizard.steps.next %}
          <button type="submit" class="btn btn-custom">
            {% trans 'Siguiente' %}
          </button>
        {% else %}
          <button
            type="button"
            class="btn btn-custom"
            onclick="return gtagSendEvent(window.location.href);">
            {% trans 'Enviar' %}
          </button>
        {% endif %}
      </div>
    </form>
  </div>
{% endblock %}
